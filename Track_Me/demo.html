<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      margin: 0;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    h1 {
      margin-bottom: 10px;
      color: var(--title);
    }
    .card {
      background: var(--card);
      padding: 20px;
      margin: 15px auto;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      transition: background 0.3s;
    }
    button {
      background: #3498db;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #2980b9;
    }
    .progress {
      height: 20px;
      background: #ddd;
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #27ae60;
      width: 0%;
      transition: 0.3s;
    }
    input, select {
      padding: 8px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: var(--habit-bg);
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #adviceBox {
      background: #eafaf1;
      border-left: 5px solid #27ae60;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      font-style: italic;
      display: none;
    }
    /* Themes */
    :root {
      --bg: #f4f6f9;
      --text: #333;
      --title: #2c3e50;
      --card: white;
      --habit-bg: #ecf0f1;
    }
    .dark {
      --bg: #1e1e1e;
      --text: #f4f4f4;
      --title: #f1c40f;
      --card: #2c2c2c;
      --habit-bg: #333;
    }
    #themeToggle {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #8e44ad;
    }
    #levelBox {
      margin: 15px;
      font-weight: bold;
      font-size: 18px;
      color: #8e44ad;
    }
  </style>
</head>
<body>
  <button id="themeToggle" onclick="toggleTheme()">🌙</button>
  <h1>🌿 Health Tracker</h1>

  <!-- Gamification -->
  <div class="card">
    <h2>🏆 Progress</h2>
    <div id="levelBox">Level: 1 | Points: 0</div>
  </div>

  <!-- Water Tracker -->
  <div class="card">
    <h2>💧 Water</h2>
    <p>Goal: 2000 ml</p>
    <p>Drank: <span id="waterCount">0</span> ml</p>
    <div class="progress">
      <div class="progress-bar" id="waterBar"></div>
    </div>
    <button onclick="addWater(250)">+ 250 ml</button>
    <button onclick="addWater(500)">+ 500 ml</button>
  </div>

  <!-- Sleep Tracker -->
  <div class="card">
    <h2>😴 Sleep</h2>
    <p>Enter sleep and wake times:</p>
    <input type="time" id="sleepTime"> → <input type="time" id="wakeTime">
    <button onclick="calcSleep()">Calculate</button>
    <p>You slept: <span id="sleepHours">0</span> h</p>
  </div>

  <!-- Exercise Tracker -->
  <div class="card">
    <h2>🏋️‍♂️ Exercise</h2>
    <select id="exerciseType">
      <option value="Running">Running</option>
      <option value="Push-ups">Push-ups</option>
      <option value="Sit-ups">Sit-ups</option>
      <option value="Gym">Gym</option>
    </select>
    <input type="number" id="exerciseValue" placeholder="minutes/reps">
    <button onclick="addExercise()">Add</button>
    <ul id="exerciseList"></ul>
  </div>

  <!-- Habit Journal -->
  <div class="card">
    <h2>📖 Habits</h2>
    <input type="text" id="habitInput" placeholder="New habit">
    <button onclick="addHabit()">Add</button>
    <ul id="habitList"></ul>
  </div>

  <!-- AI Advice -->
  <div class="card">
    <h2>🤖 Advice</h2>
    <button onclick="getAdvice()">Get Advice</button>
    <div id="adviceBox"></div>
  </div>

  <script>
    // Data
    let water = 0;
    const waterGoal = 2000;
    let sleepHours = 0;
    let points = 0;
    let level = 1;

    // WATER
    function addWater(amount) {
      water += amount;
      if (water > waterGoal) water = waterGoal;
      document.getElementById("waterCount").textContent = water;
      let percent = (water / waterGoal) * 100;
      document.getElementById("waterBar").style.width = percent + "%";
      addPoints(5); // points for water
    }

    // SLEEP
    function calcSleep() {
      let sleep = document.getElementById("sleepTime").value;
      let wake = document.getElementById("wakeTime").value;
      if (sleep && wake) {
        let sleepDate = new Date("2025-01-01T" + sleep + ":00");
        let wakeDate = new Date("2025-01-01T" + wake + ":00");
        if (wakeDate <= sleepDate) wakeDate.setDate(wakeDate.getDate() + 1);
        let diff = (wakeDate - sleepDate) / (1000 * 60 * 60);
        sleepHours = diff;
        document.getElementById("sleepHours").textContent = diff.toFixed(1);
        addPoints(10); // points for sleep
      } else {
        alert("Please enter both sleep and wake time!");
      }
    }

    // EXERCISE
    function addExercise() {
      let type = document.getElementById("exerciseType").value;
      let value = document.getElementById("exerciseValue").value;
      if (value) {
        let li = document.createElement("li");
        li.textContent = type + ": " + value;
        document.getElementById("exerciseList").appendChild(li);
        document.getElementById("exerciseValue").value = "";
        addPoints(15); // points for exercise
      } else {
        alert("Enter minutes or reps!");
      }
    }

    // HABITS
    function addHabit() {
      let habit = document.getElementById("habitInput").value;
      if (habit) {
        let li = document.createElement("li");
        li.innerHTML = `<span>${habit}</span> <button onclick="toggleHabit(this)">✔</button>`;
        document.getElementById("habitList").appendChild(li);
        document.getElementById("habitInput").value = "";
      }
    }
    function toggleHabit(button) {
      let li = button.parentElement;
      if (li.style.textDecoration === "line-through") {
        li.style.textDecoration = "none";
      } else {
        li.style.textDecoration = "line-through";
        addPoints(20); // points for completed habit
      }
    }

    // GAMIFICATION
    function addPoints(amount) {
      points += amount;
      if (points >= level * 100) {
        level++;
        points = 0;
        alert("🎉 Congrats! New Level: " + level);
      }
      document.getElementById("levelBox").textContent = `Level: ${level} | Points: ${points}`;
    }

    // ADVICE
    function getAdvice() {
      let advice = [];
      if (water < 1500) advice.push("💧 Drink more water!");
      else advice.push("Great! You are staying hydrated 👍");

      if (sleepHours < 7 && sleepHours > 0) advice.push("😴 Try to sleep more, less than 7 hours is not enough.");
      else if (sleepHours >= 7) advice.push("Awesome! You got enough rest 👌");

      if (document.getElementById("exerciseList").children.length === 0) {
        advice.push("🏋️‍♂️ Add some exercise today!");
      } else {
        advice.push("🔥 Good job, you exercised!");
      }

      document.getElementById("adviceBox").style.display = "block";
      document.getElementById("adviceBox").innerHTML = advice.join("<br>");
    }

    // THEME SWITCH
    function toggleTheme() {
      document.body.classList.toggle("dark");
      let btn = document.getElementById("themeToggle");
      if (document.body.classList.contains("dark")) {
        btn.textContent = "☀️";
      } else {
        btn.textContent = "🌙";
      }
    }
  </script>
</body>
</html>
