<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pollen Activity Card - Recreation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto; background:linear-gradient(180deg,#0b1220 0%, #07101a 100%); color:#e6eef8; margin:0;}
    .app{display:flex; min-height:100vh; gap:24px; padding:28px;}
    .sidebar{width:260px; background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:18px}
    .logo{display:flex; gap:10px; align-items:center}
    .logo .dot{width:36px;height:36px;border-radius:50%;background:linear-gradient(45deg,#ff4d4d,#ffb86b);display:inline-flex;align-items:center;justify-content:center;color:#111;font-weight:700}
    .nav{display:flex;flex-direction:column;gap:10px;margin-top:6px}
    .nav a{color:var(--muted); text-decoration:none; padding:8px 10px; border-radius:8px}
    .nav a.active{background:var(--glass); color:#e6eef8}
    .sidebar .download{margin-top:auto; padding:12px;border-radius:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), transparent); color:var(--muted); font-size:14px}
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); border-radius:16px; }
  </style>
</head>
<body class="antialiased p-8">
  <aside class="sidebar card">
      <div class="logo"><span class="dot">A</span> <div>Погода</div></div>
      <nav class="nav">
        <a class="active" href="Weather application.html">Главная</a>
        <a href="UV_Index.html">УФ‑индекс</a>
        <a href="pollen.html">Пыльца</a>
        <a href="weather_month.html">Прогноз на месяц</a>
        <a href="the_weather_for_10days.html">На 10 дней</a>
      </nav>
      <button style="width:100%;padding:12px;border-radius:10px;border:0;background:linear-gradient(90deg,#ff7a5a,#ffb86b);color:#111;font-weight:700;cursor:pointer">Скачать приложение</button>
    </aside>
  <div class="max-w-4xl mx-auto">
    <div class="glass p-6 bg-zinc-800">
      <div class="flex justify-between items-start gap-6">
        <div class="flex-1">
          <h2 class="text-2xl font-bold">Пыльца в Шымкенте <span class="text-emerald-400 font-medium">не активна</span></h2>
          <p class="mt-2 text-zinc-400">Сегодня и завтра риск аллергии на пыльцу минимален</p>
          <div class="mt-4 flex gap-2 flex-wrap">
            <button class="px-3 py-1 rounded-full bg-zinc-700">Сорняки</button>
            <button class="px-3 py-1 rounded-full bg-zinc-700">Полынь</button>
            <button class="px-3 py-1 rounded-full bg-zinc-700">Злаки</button>
            <button class="px-3 py-1 rounded-full bg-zinc-700">Берёза</button>
            <button class="px-3 py-1 rounded-full bg-zinc-700">Амброзия</button>
            <button class="px-3 py-1 rounded-full bg-zinc-700">Ольха</button>
          </div>
          <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="p-4 bg-zinc-900 rounded-lg">
              <h4 class="font-semibold">Сорняки</h4>
              <p class="text-zinc-400 mt-2">В ближайшие 10 дней активности не ожидается</p>
              <div class="mt-4 h-24 bg-zinc-800 rounded-md flex items-center justify-center text-zinc-500">(график)</div>
            </div>
            <div class="p-4 bg-zinc-900 rounded-lg">
              <h4 class="font-semibold">Карта</h4>
              <div class="mt-2 h-40 bg-zinc-800 rounded-md flex items-center justify-center text-zinc-500">(мини‑карта)</div>
            </div>
          </div>
        </div>
        <div class="w-48">
          <div class="p-4 bg-zinc-900 rounded-lg text-center">
            <div class="text-sm text-zinc-400">Как ощущается аллергия сегодня?</div>
            <div class="mt-3 flex gap-2 justify-center">
              <button class="px-3 py-2 rounded-lg glass">😊</button>
              <button class="px-3 py-2 rounded-lg glass">😐</button>
              <button class="px-3 py-2 rounded-lg glass">😢</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
